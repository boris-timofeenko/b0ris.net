<style>
html, body { margin: 0; background: #000; -webkit-text-size-adjust: 100%; }
/* The main menu of P1 at full screen. The room fills the width of the window (menu-room-wide.jpg, the 4:3 render seen
   twice as wide); what happens in it sits on the stage, the 4:3 middle at the full height of the window, and --u is
   a hundredth of the stage's width. The medallions and the key prompts keep to the edges of the window. */
.screen { --bar: 42px; --w: min(100vw, calc((100vh - var(--bar)) * 4 / 3)); --sw: var(--w); --u: calc(var(--w) / 100); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
@supports (height: 100dvh) { .screen { --w: min(100vw, calc((100dvh - var(--bar)) * 4 / 3)); min-height: 100dvh; } }
.screen > .bar { align-self: stretch; min-height: var(--bar); }
.game { position: relative; box-sizing: border-box; width: 100%; height: calc(var(--w) * 3 / 4); overflow: hidden; user-select: none;
  background: #000 url(../v/proto/menu-room-wide.jpg?v=d65f5413) 50% 0 / auto 100% no-repeat; }
.game > *, .stage > * { position: absolute; }
.stage { left: 50%; top: 0; width: var(--sw); height: calc(var(--sw) * 3 / 4); margin-left: calc(var(--sw) / -2); --u: calc(var(--sw) / 100); }
/* the glass of the CRT in the render (tools/proto/room3d.py prints these) */
.tv { left: 38.52%; top: 44.19%; width: 22.95%; height: 22.55%; background: #000; display: block; overflow: hidden; border-radius: 1.5% / 2%; }
.tv > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.tv img, .tv canvas { display: block; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.tv video { display: none; }
.tv .strip { height: auto; animation: scrollup 14s linear infinite alternate; }
.tv .pan { width: auto; max-width: none; height: 100%; animation: panx 16s ease-in-out infinite alternate; }
.tv .zoom { animation: zoom 9s ease-in-out infinite alternate; transform-origin: 55% 45%; }
.tv .snow { visibility: hidden; z-index: 3; }
.tv .glass { z-index: 4; pointer-events: none; background:
  linear-gradient(140deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 30%, rgba(255,255,255,0) 45%),
  repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px);
  box-shadow: inset 0 0 calc(2.4 * var(--u)) rgba(0,0,0,0.75); border-radius: inherit; }
@keyframes scrollup { from { transform: translateY(0); } to { transform: translateY(-57%); } }
@keyframes panx { from { transform: translateX(0); } to { transform: translateX(calc(-100% + calc(27.5 * var(--u)))); } }
@keyframes zoom { from { transform: scale(1); } to { transform: scale(1.35); } }

.capbar { top: 1.2%; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: calc(1.2 * var(--u)); pointer-events: none; }
.capbar img { height: calc(3.3 * var(--u)); width: auto; image-rendering: pixelated; }
.capbar button { pointer-events: auto; background: none; border: 0; padding: 0; cursor: pointer; line-height: 0; }
.capbar button:active { transform: translateY(1px); }
/* what the project is, on the desk under the keyboard */
.about { top: 90.6%; left: 24%; right: 24%; margin: 0; text-align: center; font: bold calc(1.75 * var(--u))/1.3 Arial, Helvetica, sans-serif; color: #FFFFFF; pointer-events: none;
  text-shadow: -1px -1px 0 #000033, 1px -1px 0 #000033, -1px 1px 0 #000033, 1px 1px 0 #000033, 2px 2px 0 #000033; }

/* the keys, bottom right, the way PS2 menus showed their button prompts */
.prompts { right: 2%; bottom: 1.6%; margin: 0; font: bold calc(1.5 * var(--u))/1 Arial, Helvetica, sans-serif; color: #FFFFFF; pointer-events: none;
  text-shadow: 1px 1px 0 #000033, -1px 0 0 #000033; }
.prompts kbd { font: inherit; display: inline-block; min-width: 1.2em; padding: 0.25em 0.35em; margin: 0 0.25em 0 0.7em; text-align: center; color: #000033; background: #CCEEFF; border-radius: 0.3em; text-shadow: none; }
@media (hover: none) { .prompts { display: none; } }
.zero { width: calc(13 * var(--u)); line-height: 0; transition: transform 0.2s steps(2); }
.zero img { width: 100%; height: auto; }
.zero[data-level="0"] { right: 0.6%; top: 5%; }
.zero[data-level="1"] { left: 0.6%; top: 3%; }
.zero[data-level="2"] { left: 0.6%; top: 23%; }
.zero[data-level="3"] { right: 0.6%; top: 25%; }
.zero[data-level="4"] { left: 0.6%; top: 43%; }
.zero .nm { display: block; width: max-content; margin: calc(-0.6 * var(--u)) auto 0; padding: calc(0.35 * var(--u)) calc(0.9 * var(--u)); background: #000; color: #FFF; font: bold calc(1.55 * var(--u))/1 "Times New Roman", Times, serif; letter-spacing: 0.08em; text-transform: uppercase; }
/* on the right wall a name wider than its medallion grows to the left, not off the screen */
.zero.r { display: flex; flex-direction: column; align-items: flex-end; }
.zero.r .nm { margin-right: 0; margin-left: 0; }
.zero:hover, .zero.on { transform: translateY(-1.2%) rotate(-3deg); }
.zero.on img { filter: brightness(1.12); }
/* Tundra sits on her blob shadow behind the CD; the box and the layers come from scene3d/src/projects_tundra_pack.py,
   v/disc/desk-dog.js draws her on the canvas over the still */
.dog { left: 66.75%; top: 39.50%; width: 18.12%; line-height: 0; cursor: pointer; }
.dog img { width: 100%; height: auto; }
.dog canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.spot { display: block; left: 77.3%; top: 75.45%; width: 11.18%; height: 8.95%; }
.glow { inset: 0; pointer-events: none; mix-blend-mode: screen; transition: background 0.4s;
  background: radial-gradient(ellipse 26% 20% at 50% 55%, rgba(var(--glow, 120,150,200), 0.26), rgba(0,0,0,0) 100%),
              radial-gradient(ellipse 30% 12% at 50% 84%, rgba(var(--glow, 120,150,200), 0.3), rgba(0,0,0,0) 100%); }
.dim { inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 42%, rgba(0,0,30,0) 45%, rgba(0,0,30,0.42) 100%); }

.tag { position: absolute; z-index: 6; white-space: nowrap; font: bold calc(2.3 * var(--u))/1.1 Arial, Helvetica, sans-serif; color: #FFFF33; visibility: hidden; pointer-events: none;
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 0 #000; }
.tag::after { content: ""; display: block; width: 0; height: 0; margin: calc(0.3 * var(--u)) auto 0; border: calc(1.1 * var(--u)) solid transparent; border-top: calc(1.6 * var(--u)) solid #FFFF33; border-bottom: 0; filter: drop-shadow(1px 1px 0 #000); }
.tag.l::after { margin-left: calc(0.6 * var(--u)); }
a:hover > .tag, a:focus > .tag, .dog:hover > .tag { visibility: visible; }

/* phones held upright: the room fills the screen, seen through a camera of its own (menu-room-phone.jpg, 1:2,
   tools/proto/room3d.py --phone prints the places below); the stage is that picture as the screen crops it; the
   medallions in a row along the top, what the chosen project is on the front of the desk */
.info { display: none; }
@media (max-width: 700px), (max-aspect-ratio: 4/5) {
  .screen { --w: 100vw; --gh: calc(100vh - var(--bar)); --sw: max(100vw, calc(var(--gh) / 2)); position: relative; }
  @supports (height: 100dvh) { .screen { --gh: calc(100dvh - var(--bar)); } }
  .game { height: var(--gh); background: #000 url(../v/proto/menu-room-phone.jpg?v=8592a08a) 50% 50% / cover no-repeat; touch-action: pan-y; }
  .stage { top: 50%; height: calc(var(--sw) * 2); margin-top: calc(var(--sw) * -1); }
  .tv { left: 12.66%; top: 43.83%; width: 36.82%; height: 12.37%; }
  .spot { left: 74.36%; top: 56.14%; width: 16.9%; height: 13.52%; }
  .dog { left: 62.25%; top: 37%; width: 32%; }
  .glow { background: radial-gradient(ellipse 40% 9% at 31% 50%, rgba(var(--glow, 120,150,200), 0.26), rgba(0,0,0,0) 100%),
                      radial-gradient(ellipse 42% 5% at 31% 61%, rgba(var(--glow, 120,150,200), 0.3), rgba(0,0,0,0) 100%); }
  .zero, .zero.r { width: 17vw; }
  .zero .nm { display: none; }
  .zero.on { transform: translateY(-4%) scale(1.12); }
  .zero[data-level] { top: 3vw; right: auto; }
  .zero[data-level="0"] { left: 2.5vw; } .zero[data-level="1"] { left: 21.75vw; } .zero[data-level="2"] { left: 41vw; }
  .zero[data-level="3"] { left: 60.25vw; } .zero[data-level="4"] { left: 79.5vw; }
  .capbar { top: calc(3vw + 18vw + 4vw); gap: 2vw; }
  .capbar img { height: 6.6vw; }
  .about, .prompts { display: none; }
  .tag { font-size: 3.4vw; }
  .info { display: block; position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 0 5vw calc(5vw + env(safe-area-inset-bottom)); text-align: center;
    color: #FFF; font: bold 4.6vw/1.3 Arial, Helvetica, sans-serif;
    text-shadow: -1px -1px 0 #000033, 1px -1px 0 #000033, -1px 1px 0 #000033, 1px 1px 0 #000033, 2px 2px 0 #000033; }
  .info h2 { display: none; }
  .info p { margin: 0 0 4vw; }
  .info .open { display: inline-block; margin: 0 1.5vw; padding: 0.35em 0.8em; color: #000033; background: #CCEEFF; border-radius: 0.3em; text-decoration: none; text-shadow: none; font: bold 4.4vw/1 Arial, Helvetica, sans-serif; }
  .info .all { background: #FFFF66; }
}
</style>
