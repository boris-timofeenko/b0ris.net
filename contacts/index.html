<style>
/* The contacts drawn in Paint: the grey workspace over the whole screen, a white canvas */
html { background: #808080; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
@supports (height: 100dvh) { body { min-height: 100dvh; } }
img { image-rendering: pixelated; }
.work { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 16px; }
.canvas { position: relative; box-sizing: border-box; width: 100%; max-width: 900px; min-height: 470px; margin: 0 auto; padding: 22px 24px 26px; background: #FFFFFF; box-shadow: 1px 1px 0 #000; overflow: hidden; }
.canvas h1 { margin: 0 0 18px; line-height: 0; }
/* the Text tool had no smoothing */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 520px; position: relative; z-index: 1;
  font: 17px/1.3 Arial, Helvetica, sans-serif; -webkit-font-smoothing: none; color: #000; }
.list li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
.list b { display: block; font-weight: bold; }
.list a { color: #0000FF; overflow-wrap: anywhere; }
.list a.pic { display: block; line-height: 0; border: 1px dashed transparent; }
.list a.pic:hover, .list a.pic:focus { border-color: #000; outline: none; }
.list small { font-size: 14px; color: #808080; }
.where { margin: 20px 0 0; font: 15px/1.4 Arial, Helvetica, sans-serif; -webkit-font-smoothing: none; color: #000; position: relative; z-index: 1; max-width: 520px; }
.dog { position: absolute; right: 8px; bottom: -6px; width: 300px; height: auto; }
.handle { position: absolute; right: -4px; bottom: -4px; width: 6px; height: 6px; background: #000080; }
@media (max-width: 700px) {
  .work { padding: 12px 10px; justify-content: flex-start; }
  .canvas { padding: 16px 14px 220px; min-height: 0; }
  .dog { width: 210px; right: 50%; margin-right: -105px; }
}
</style>
