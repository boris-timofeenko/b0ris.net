body { margin: 0; min-height: 100vh; color: #000; font: 17px/1.3 Arial, Helvetica, sans-serif;

.list a.pic { display: block; line-height: 0; border: 1px dashed transparent; }
.list li:hover a.pic, .list a.pic:focus { border-color: #000; outline: none; }
.list small { font-size: 14px; color: #808080; }
.where { margin: 22px 0 0; font-size: 15px; -webkit-font-smoothing: none; max-width: 470px; }
.pdog { position: absolute; right: 40px; bottom: 8px; line-height: 0; cursor: pointer; }
